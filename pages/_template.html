<!DOCTYPE html>
<!--
  NEW PAGE TEMPLATE
  1. Copy this file → pages/your-page-name.html
  2. Change <title>, the description, and the <main> content below.
  3. Add the page to `nav` in src/js/config/site.config.js  (header + mobile menu update automatically).
  4. If you used Tailwind classes that no other page uses, run:  npm run build
-->
<html lang="en" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex"> <!-- remove this line in your real page -->
  <title>Page Title | Praba Yoga</title>
  <meta name="description" content="One or two sentences (max ~160 characters) describing this page for search engines.">
  <meta name="theme-color" content="#FAF9F4">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap">
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/main.js" defer></script>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div id="site-header"></div>

  <main id="main-content" class="w-full bg-surface">

    <!-- Page hero -->
    <section class="bg-surface-container-low py-section">
      <div class="max-w-7xl mx-auto px-6 lg:px-12">
        <h1 class="font-display-hero text-display-hero text-on-surface max-w-3xl">Page heading</h1>
        <p class="mt-4 max-w-2xl font-body-lg text-body-lg text-on-surface-variant">A short introduction to this page.</p>
      </div>
    </section>

    <!-- Content section -->
    <section class="py-section">
      <div class="max-w-7xl mx-auto px-6 lg:px-12">
        <h2 class="font-headline-lg text-headline-lg text-on-surface mb-block">Section heading</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <article class="bg-surface-container-lowest p-6 rounded-xl shadow-sm">
            <h3 class="font-headline-sm text-headline-sm text-on-surface">Card title</h3>
            <p class="mt-2 font-body-md text-body-md text-on-surface-variant">Card text.</p>
          </article>
        </div>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>
</body>
</html>
